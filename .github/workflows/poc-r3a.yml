# Uji regresi minimum PoC R3a (Kandidat A): PostgreSQL + PgBouncer mode transaksi + API + PITR + meta.
# PoC BUKAN skema produksi. Lulus di sini = lulus uji PoC di CI, BUKAN bukti aplikasi produksi aman.
name: poc-r3a-regression

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: poc-r3a-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PG_BIN: /usr/lib/postgresql/16/bin
      POC_RUNTIME: ${{ runner.temp }}/poc_runtime
      POC_RESULTS: ${{ github.workspace }}/poc/r3a/results
      EXPECTED_TESTS: "67"
    defaults:
      run:
        working-directory: poc/r3a
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Pasang PostgreSQL 16 dan PgBouncer (layanan bawaan dimatikan)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-16 postgresql-client-16 pgbouncer
          sudo systemctl stop postgresql pgbouncer || true
          "$PG_BIN/postgres" --version
          pgbouncer --version | head -1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: poc/r3a/api/package-lock.json

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Dependensi Python (versi dikunci)
        run: pip install "psycopg[binary]==3.3.8"

      - name: Setup lingkungan uji (gagal bila migrasi error)
        run: bash scripts/setup.sh

      - name: Jalankan seluruh uji PoC
        run: bash scripts/run_all.sh

      - name: Wajib tepat 67 uji dan semuanya PASS
        run: |
          python3 - <<'EOF'
          import json, glob, os
          rows = []
          for f in sorted(glob.glob(os.path.join(os.environ["POC_RESULTS"], "*.json"))):
              d = json.load(open(f))
              rows += d if isinstance(d, list) else [{"id": "PITR", "status": d.get("status")}]
          bad = [r["id"] for r in rows if r.get("status") != "PASS"]
          exp = int(os.environ["EXPECTED_TESTS"])
          lines = [f"Uji berjalan: {len(rows)} (wajib {exp})", f"Bukan PASS: {bad or 'tidak ada'}"]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as s:
              s.write("## PoC R3a\n\n" + "\n\n".join(lines) + "\n")
          print("\n".join(lines))
          raise SystemExit(0 if len(rows) == exp and not bad else 1)
          EOF

      - name: Simpan hasil uji
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: poc-r3a-results-${{ github.run_number }}
          path: poc/r3a/results/
          retention-days: 30

      - name: Hentikan proses
        if: always()
        run: bash scripts/teardown.sh
